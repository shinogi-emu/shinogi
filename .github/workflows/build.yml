name: build

# Builds the guest once and packages it for each platform.
#
# The guest is host-independent -- the same emutos-virt.elf runs on
# Linux, Windows and macOS -- so it is built once and handed to the
# packaging jobs as an artifact, rather than rebuilt three times.

on:
  push:
    branches: [ main ]
    tags: [ 'b*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Prebuilt m68k-atari-mintelf toolchain, the same source FreeMiNT's own
  # CI uses. Note this publishes GCC 7.5.0: EmuTOS's ELF build passes
  # --param=min-pagesize=0, which does not exist before GCC 11 and is a
  # hard error rather than a warning, so the Makefile probes for it.
  TOOLCHAIN_URL: https://atari.joska.no/snapshots
  QEMU_WIN_URL: https://qemu.weilnetz.de/w64/qemu-w64-setup-20260729.exe
  SDL2_MINGW_URL: https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz
  # The drive C system tree, published once as a release asset. Pinned by
  # checksum: it is 43 MB of guest software that every package lays down,
  # and a silently changed tree would ship to users unnoticed.
  DRIVE_C_URL: https://github.com/shinogi-emu/shinogi/releases/download/drive-c-v1/freemint-install.zip
  DRIVE_C_SHA256: 19b8a35ad7fb6aacf9ba3d68b8814c888f97d4d20cf2f8d650075cca9c5a5ec8

jobs:
  guest:
    name: guest image (${{ matrix.edition }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 040 image is built -m68040. The 060 image must NOT be:
          # gcc then emits the 64-bit MULU.L/DIVU.L forms the 68060 moved
          # into software, and EmuTOS faults on one before anything can
          # load the 060 package from AUTO. Verified -- the -m68040 image
          # on -cpu m68060 dies with "Panic: Exception number 61", while
          # -m68020-60 boots past VDI init. So the 060 edition gets a
          # 020-60 guest, exactly as its FreeMiNT kernel is 020-60.
          - edition: Shinogi-040
            cpu: m68040
            cpuflags: -m68040
          - edition: Shinogi-060
            cpu: m68060
            cpuflags: -m68020-60
    steps:
      - uses: actions/checkout@v5
        with:
          # The guest is a submodule, shinogi-emu/emutos. It is public, so
          # the default token reaches it. While it was private every run
          # died HERE, before a single build step, and every downstream job
          # was skipped -- which is why no macOS package existed until
          # 2026-08-22 despite the signing chain being complete.
          submodules: recursive

      - name: Fetch the cross toolchain
        run: |
          set -eux
          sudo mkdir -p /
          for pkg in binutils gcc; do
            curl -fsSL "$TOOLCHAIN_URL/$pkg/$pkg-mintelf-current.tar.bz2" \
              | sudo tar xjf - -C /
          done
          m68k-atari-mintelf-gcc --version

      - name: Build
        working-directory: emutos
        run: |
          make ELF=1 TOOLCHAIN_PREFIX=m68k-atari-mintelf- \
               CPUFLAGS='${{ matrix.cpuflags }}' qemu-virt

      - name: Check it is a real m68k image
        working-directory: emutos
        run: |
          set -eux
          test -s emutos-virt.elf
          file emutos-virt.elf | grep -q "Motorola m68k"

      # The wire header rides along with the image.  run-all-goldens.sh
      # compares the guest and host copies before it runs anything, and the
      # goldens job does not check out the submodule -- that would mean a
      # second clone of the whole guest repo for one file.  Both
      # paths share the emutos/ prefix, so the artifact keeps
      # emutos-virt.elf at its root and bios/hostfs_proto.h beside it.
      - uses: actions/upload-artifact@v5
        with:
          name: guest-${{ matrix.cpu }}
          path: |
            emutos/emutos-virt.elf
            emutos/bios/hostfs_proto.h
          if-no-files-found: error
          # Build outputs, not releases. The 90-day default filled the
          # storage allowance with 149 artifacts and stopped CI dead.
          retention-days: 7

  # The goldens boot the guest under QEMU and diff its serial output.
  # They are the only thing that proves the image works rather than
  # merely links, so a package is never published without them.
  # The emulator the goldens run on.
  #
  # ubuntu-24.04's apt ships qemu-system-m68k 8.2.2, which ships nowhere:
  # the Windows bundle carries the project build (v11.0.0-rc4) and the
  # macOS app carries Homebrew's 11.0.2. On 8.2.2 the 060 guest panics
  # with "Exception number 33" on every golden, and on stock 10.2.1 it
  # panics with "Line F Emulator" on two of them -- the 68060
  # unimplemented-FPU trap. Gating a guest on an emulator nobody runs
  # measures the emulator, not the guest.
  qemu:
    name: qemu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: shinogi-emu/qemu-m68k
          ref: shinogi-060
          path: qemu-src

      - name: Record the source revision
        id: rev
        working-directory: qemu-src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Keyed on the exact revision, so a rebuild happens only when the
      # emulator actually changes.
      - uses: actions/cache@v4
        id: cache
        with:
          path: qemu-install
          key: qemu-m68k-${{ steps.rev.outputs.sha }}-v1

      - name: Build it
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libcap-ng-dev libattr1-dev
          cd qemu-src
          # virtfs is not optional here: every golden mounts the fixture
          # folder over virtio-9p.
          ./configure --target-list=m68k-softmmu \
                      --enable-virtfs \
                      --disable-docs --disable-gtk --disable-sdl \
                      --disable-vnc --disable-werror
          make -j"$(nproc)"
          make install DESTDIR="$GITHUB_WORKSPACE/qemu-install"

      - name: Check it is the emulator we asked for
        run: |
          set -eu
          BIN=$(find qemu-install -name qemu-system-m68k -type f | head -1)
          [ -n "$BIN" ] || { echo "no qemu-system-m68k was built" >&2; exit 1; }
          "$BIN" --version
          # 8.2.x is the apt build this job exists to replace.
          case "$("$BIN" --version | head -1)" in
            *"version 8."*) echo "built an 8.x -- wrong source" >&2; exit 1 ;;
          esac
          "$BIN" -M virt -cpu m68060 -m 8 -display none -S -monitor none \
                 -serial none & sleep 2; kill $! 2>/dev/null || true
          echo "m68060 on -M virt accepted"

      - uses: actions/upload-artifact@v5
        with:
          name: qemu-host
          path: qemu-install/**
          if-no-files-found: error
          retention-days: 7

  test:
    name: goldens (${{ matrix.edition }})
    needs: [ guest, qemu ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Shinogi-040
            cpu: m68040
          - edition: Shinogi-060
            cpu: m68060
    steps:
      - uses: actions/checkout@v5
      # Each guest is booted on the CPU it ships for. Booting the 060
      # image as an 040 would prove nothing about the edition that
      # actually ships it.
      - uses: actions/download-artifact@v5
        with:
          name: guest-${{ matrix.cpu }}
          path: guest

      - uses: actions/download-artifact@v5
        with:
          name: qemu-host
          path: qemu-install

      - name: Put the built QEMU on PATH
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y libpixman-1-0 libglib2.0-0 libcap-ng0
          BIN=$(find qemu-install -name qemu-system-m68k -type f | head -1)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Build the fixtures
        run: python3 tools/make-fixtures.py /tmp/shinogi-hostfs

      - name: Run the goldens
        env:
          SHINOGI_CPU: ${{ matrix.cpu }}
          SHINOGI_ELF: ${{ github.workspace }}/guest/emutos-virt.elf
          # Not a real EmuTOS tree, just the artifact -- but it carries
          # bios/hostfs_proto.h, which is all the wire-header check reads.
          SHINOGI_EMUTOS: ${{ github.workspace }}/guest
        run: ./tools/run-all-goldens.sh

  freemint:
    name: freemint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: shinogi-emu/freemint
          ref: virtio-net
          path: freemint

      # FreeMiNT is an a.out build -- m68k-atari-mint, NOT the mintelf
      # toolchain the guest job fetches. Same server, different tarball.
      #
      # The compiler alone is not enough: sys/arch/magic/genmagic.c is a
      # host-side generator that includes <mint/mintbind.h>, so the
      # mintlib sysroot has to be there too or the very first object
      # fails. This mirrors what FreeMiNT's own CI installs, and the
      # split matters -- the tools go to /, the libraries go to the cross
      # sysroot. gcc and binutils take "current", everything else takes
      # "latest", which is also upstream's rule.
      - name: Fetch the a.out cross toolchain
        run: |
          set -eux
          for pkg in binutils gcc; do
            curl -fsSL "$TOOLCHAIN_URL/$pkg/$pkg-mint-current.tar.bz2" \
              | sudo tar xjf - -C /
          done
          curl -fsSL "$TOOLCHAIN_URL/mintbin/mintbin-mint-latest.tar.bz2" \
            | sudo tar xjf - -C /
          SYSROOT=/usr/m68k-atari-mint/sys-root
          sudo mkdir -p "$SYSROOT"
          for pkg in mintlib fdlibm gemlib cflib gemma; do
            curl -fsSL "$TOOLCHAIN_URL/$pkg/$pkg-mint-latest.tar.bz2" \
              | sudo tar xjf - -C "$SYSROOT"
          done
          m68k-atari-mint-gcc --version
          test -f "$SYSROOT/usr/include/mint/mintbind.h" \
            || find "$SYSROOT" -name mintbind.h

      # hat02060 is not an upstream target; it is defined here on the make
      # command line, which is how FreeMiNT's sys/KERNELDEFS says to add
      # one. Same KERNELDEFS as the 040 kernel -- -DM68040 selects the
      # runtime MMU and cache model -- but built for the 020-060 family,
      # so one kernel serves both the 040 and 060 editions.
      - name: Build the kernel, the 060 package and the network driver
        working-directory: freemint
        env:
          M68K_ATARI_MINT_CROSS: yes
          KDEFS: >-
            -DCRYPTO_CODE -DSOFT_UNITABLE -DBUILTIN_SHELL -DM68040 -DOLDTOSFS -DWITH_MMU_SUPPORT -DMACHINE_QEMU_VIRT
        run: |
          set -eux
          make -C sys \
            kerneltargets=hat02060 \
            CPU_hat02060=02060 \
            MINT_hat02060=mint0206h.prg \
            "KERNELDEFS_hat02060=$KDEFS" \
            hat02060
          make -C sys/arch/060sp
          make -C sys/sockets/xif/virtio_net

      # The kernel records its own build flags, so this checks that what
      # came out is the kernel we asked for rather than merely that a
      # kernel came out. Without it a target that silently fell back to
      # different defs would ship looking identical.
      - name: Check the kernel is the one we asked for
        run: |
          set -eu
          for f in freemint/sys/.compile_hat02060/mint0206h.prg \
                   freemint/sys/arch/060sp/060sp.prg \
                   freemint/sys/sockets/xif/virtio_net/.compile_02060/virtio_net.xif; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          strings freemint/sys/.compile_hat02060/mint0206h.prg \
            | grep -q -- "-DMACHINE_QEMU_VIRT" \
            || { echo "kernel was not built with MACHINE_QEMU_VIRT" >&2; exit 1; }
          strings freemint/sys/.compile_hat02060/mint0206h.prg \
            | grep -q -- "-m68020-60" \
            || { echo "kernel is not an 020-060 build" >&2; exit 1; }
          mkdir -p mint
          cp freemint/sys/.compile_hat02060/mint0206h.prg mint/
          cp freemint/sys/arch/060sp/060sp.prg mint/
          cp freemint/sys/sockets/xif/virtio_net/.compile_02060/virtio_net.xif mint/
          ls -l mint/

      - uses: actions/upload-artifact@v5
        with:
          name: mint
          path: mint/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows package (${{ matrix.edition }})
    needs: [ guest, test, freemint ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Shinogi-040
            cpu: m68040
          - edition: Shinogi-060
            cpu: m68060
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: guest-${{ matrix.cpu }}
          path: guest
      # The drive C system tree: EmuTOS, fVDI, FreeMiNT, XaAES with its
      # widget and palette set, MyAES/Thing and the bundled applications.
      # Published once as a release asset rather than rebuilt per run --
      # tools/make-mint-install.sh reproduces it exactly, but several of
      # its inputs are third-party binaries a runner cannot fetch.
      - name: Fetch the drive C system tree
        run: |
          set -eux
          curl -fsSL "$DRIVE_C_URL" -o freemint-install.zip
          echo "$DRIVE_C_SHA256  freemint-install.zip" | sha256sum -c -
      - uses: actions/download-artifact@v5
        with:
          name: mint
          path: mint

      - name: Install the cross toolchain and installer builder
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nsis p7zip-full

      - name: Fetch SDL2 for mingw
        run: |
          set -eux
          curl -fsSL "$SDL2_MINGW_URL" -o sdl2.tar.gz
          mkdir -p "${{ github.workspace }}/mingw-sdl2"
          tar xzf sdl2.tar.gz --strip-components=1 \
              -C "${{ github.workspace }}/mingw-sdl2"

      - name: Fetch and unpack QEMU for Windows
        run: |
          set -eux
          curl -fsSL "$QEMU_WIN_URL" -o qemu-w64-setup.exe
          mkdir -p qemu-w64
          7z x -oqemu-w64 qemu-w64-setup.exe > /dev/null
          test -s qemu-w64/qemu-system-m68k.exe

      - name: Build the package
        env:
          SHINOGI_ELF: ${{ github.workspace }}/guest/emutos-virt.elf
          QEMU_WIN: ${{ github.workspace }}/qemu-w64
          SDL2_MINGW: ${{ github.workspace }}/mingw-sdl2/x86_64-w64-mingw32
          # Without these three the packager looks for a FreeMiNT tree in
          # a home directory, which is why this job failed on every run
          # before the freemint job existed.
          SHINOGI_MINT_KERNEL: ${{ github.workspace }}/mint/mint0206h.prg
          SHINOGI_060SP: ${{ github.workspace }}/mint/060sp.prg
          SHINOGI_NET_DRIVER: ${{ github.workspace }}/mint/virtio_net.xif
          SHINOGI_CPU: ${{ matrix.cpu }}
          SHINOGI_DRIVE_C_ZIP: ${{ github.workspace }}/freemint-install.zip
        run: ./tools/make-windows-package.sh "${{ github.workspace }}/dist"

      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.cpu }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macos package (${{ matrix.edition }})
    needs: [ guest, test, freemint ]
    runs-on: macos-14          # Apple Silicon
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Shinogi-040
            cpu: m68040
          - edition: Shinogi-060
            cpu: m68060
    # The secrets context is not available in an `if:` condition, but it
    # is available in `env:`. Resolve the "do we have credentials" checks
    # once here, and let the steps test these instead.
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAVE_NOTARY: ${{ secrets.MACOS_NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: guest-${{ matrix.cpu }}
          path: guest
      - uses: actions/download-artifact@v5
        with:
          name: mint
          path: mint

      - name: Fetch the drive C system tree
        run: |
          set -eux
          curl -fsSL "$DRIVE_C_URL" -o freemint-install.zip
          echo "$DRIVE_C_SHA256  freemint-install.zip" | shasum -a 256 -c -

      - name: Install QEMU and the bundling tool
        # dylibbundler rewrites QEMU's dylib references to
        # @executable_path so the app runs on a machine without
        # Homebrew. It is not preinstalled on the runner.
        run: brew install qemu dylibbundler

      - name: Build the app bundle
        env:
          SHINOGI_ELF: ${{ github.workspace }}/guest/emutos-virt.elf
          SHINOGI_CPU: ${{ matrix.cpu }}
          SHINOGI_DRIVE_C_ZIP: ${{ github.workspace }}/freemint-install.zip
          SHINOGI_MINT_KERNEL: ${{ github.workspace }}/mint/mint0206h.prg
          SHINOGI_060SP: ${{ github.workspace }}/mint/060sp.prg
          SHINOGI_NET_DRIVER: ${{ github.workspace }}/mint/virtio_net.xif
        run: ./tools/make-macos-package.sh "${{ github.workspace }}/dist"

      # Signing and notarisation only run when the secrets exist, so a
      # fork or a pull request still produces an unsigned bundle that can
      # be tested locally with `xattr -d com.apple.quarantine`.
      - name: Import the signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign
        if: env.HAVE_CERT == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./tools/sign-macos.sh "${{ github.workspace }}/dist/shinogi.app"

      - name: Notarise
        if: env.HAVE_NOTARY == 'true'
        env:
          ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          set -eu
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent dist/shinogi.app "$RUNNER_TEMP/shinogi.zip"
          xcrun notarytool submit "$RUNNER_TEMP/shinogi.zip" \
            --issuer "$ISSUER" --key-id "$KEY_ID" \
            --key "$RUNNER_TEMP/notary.p8" --wait
          # The ticket has to be stapled to the bundle, or a machine that
          # is offline when it first runs the app still sees it as
          # unnotarised.
          xcrun stapler staple dist/shinogi.app
          xcrun stapler validate dist/shinogi.app
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Package for download
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          set -eu
          VERSION=$(cat VERSION)
          ditto -c -k --keepParent dist/shinogi.app \
            "dist/$EDITION-$VERSION-macos-arm64.zip"
          shasum -a 256 "dist/$EDITION-$VERSION-macos-arm64.zip" \
            > "dist/$EDITION-$VERSION-macos-arm64.zip.sha256"

      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.cpu }}
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 7

  # A soft release: pushing a tag like b9 builds every package and
  # attaches them to a GitHub prerelease. Prerelease rather than latest,
  # so a tag does not silently become the thing the repo front page
  # recommends. Asset download counts are per file, which is what makes
  # 040 against 060 and macOS against Windows answerable.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/b')
    needs: [ windows, macos ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true

      # Four packages and their checksums. Fewer means a matrix leg
      # failed without failing this job, and a release missing an edition
      # would quietly bias exactly the comparison it exists to make.
      - name: Check every package is present
        run: |
          set -eu
          ls -l dist/
          missing=
          for f in Shinogi-040-*-win64-setup.exe \
                   Shinogi-060-*-win64-setup.exe \
                   Shinogi-040-*-macos-arm64.zip \
                   Shinogi-060-*-macos-arm64.zip; do
            # shellcheck disable=SC2086
            set -- dist/$f
            [ -e "$1" ] || missing="$missing $f"
          done
          [ -z "$missing" ] || { echo "missing packages:$missing" >&2; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(cat VERSION)
          cat > notes.md <<NOTES
          Shinogi $VERSION, for macOS (Apple Silicon) and Windows x64.

          Two editions, differing only in the emulated CPU. Both carry the
          same system tree and the same desktop.

          - **Shinogi-060** - the default. Start here.
          - **Shinogi-040** - a control, and a fallback if something
            misbehaves on the 060.

          Each package is self-contained. A first install lays down drive C
          for you: EmuTOS, fVDI, FreeMiNT, XaAES and the bundled GEM
          applications. An existing drive C keeps your files and your edited
          configs - only the kernel and drivers are refreshed.

          The macOS builds are signed, notarised and stapled. Check a
          download against its .sha256 before running it.

          Built from $GITHUB_SHA.
          NOTES
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shinogi $VERSION" \
            --prerelease \
            --notes-file notes.md
