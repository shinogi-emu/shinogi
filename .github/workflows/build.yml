name: build

# Builds the guest once and packages it for each platform.
#
# The guest is host-independent -- the same emutos-virt.elf runs on
# Linux, Windows and macOS -- so it is built once and handed to the
# packaging jobs as an artifact, rather than rebuilt three times.

on:
  push:
    branches: [ main ]
    tags: [ 'b*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Prebuilt m68k-atari-mintelf toolchain, the same source FreeMiNT's own
  # CI uses. Note this publishes GCC 7.5.0: EmuTOS's ELF build passes
  # --param=min-pagesize=0, which does not exist before GCC 11 and is a
  # hard error rather than a warning, so the Makefile probes for it.
  TOOLCHAIN_URL: https://atari.joska.no/snapshots
  QEMU_WIN_URL: https://qemu.weilnetz.de/w64/qemu-w64-setup-20260729.exe
  SDL2_MINGW_URL: https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz

jobs:
  guest:
    name: guest image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The guest is a submodule, shinogi-emu/emutos. It is public, so
          # the default token reaches it. While it was private every run
          # died HERE, before a single build step, and every downstream job
          # was skipped -- which is why no macOS package existed until
          # 2026-08-22 despite the signing chain being complete.
          submodules: recursive

      - name: Fetch the cross toolchain
        run: |
          set -eux
          sudo mkdir -p /
          for pkg in binutils gcc; do
            curl -fsSL "$TOOLCHAIN_URL/$pkg/$pkg-mintelf-current.tar.bz2" \
              | sudo tar xjf - -C /
          done
          m68k-atari-mintelf-gcc --version

      - name: Build
        working-directory: emutos
        run: make ELF=1 TOOLCHAIN_PREFIX=m68k-atari-mintelf- qemu-virt

      - name: Check it is a real m68k image
        working-directory: emutos
        run: |
          set -eux
          test -s emutos-virt.elf
          file emutos-virt.elf | grep -q "Motorola m68k"

      # The wire header rides along with the image.  run-all-goldens.sh
      # compares the guest and host copies before it runs anything, and the
      # goldens job does not check out the submodule -- that would mean a
      # second clone of the whole guest repo for one file.  Both
      # paths share the emutos/ prefix, so the artifact keeps
      # emutos-virt.elf at its root and bios/hostfs_proto.h beside it.
      - uses: actions/upload-artifact@v5
        with:
          name: guest
          path: |
            emutos/emutos-virt.elf
            emutos/bios/hostfs_proto.h
          if-no-files-found: error
          # Build outputs, not releases. The 90-day default filled the
          # storage allowance with 149 artifacts and stopped CI dead.
          retention-days: 7

  # The goldens boot the guest under QEMU and diff its serial output.
  # They are the only thing that proves the image works rather than
  # merely links, so a package is never published without them.
  test:
    name: goldens
    needs: guest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: guest
          path: guest

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-m68k

      - name: Build the fixtures
        run: python3 tools/make-fixtures.py /tmp/shinogi-hostfs

      - name: Run the goldens
        env:
          SHINOGI_ELF: ${{ github.workspace }}/guest/emutos-virt.elf
          # Not a real EmuTOS tree, just the artifact -- but it carries
          # bios/hostfs_proto.h, which is all the wire-header check reads.
          SHINOGI_EMUTOS: ${{ github.workspace }}/guest
        run: ./tools/run-all-goldens.sh

  freemint:
    name: freemint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: shinogi-emu/freemint
          ref: virtio-net
          path: freemint

      # FreeMiNT is an a.out build -- m68k-atari-mint, NOT the mintelf
      # toolchain the guest job fetches. Same server, different tarball.
      - name: Fetch the a.out cross toolchain
        run: |
          set -eux
          for pkg in binutils gcc; do
            curl -fsSL "$TOOLCHAIN_URL/$pkg/$pkg-mint-current.tar.bz2" \
              | sudo tar xjf - -C /
          done
          m68k-atari-mint-gcc --version

      # hat02060 is not an upstream target; it is defined here on the make
      # command line, which is how FreeMiNT's sys/KERNELDEFS says to add
      # one. Same KERNELDEFS as the 040 kernel -- -DM68040 selects the
      # runtime MMU and cache model -- but built for the 020-060 family,
      # so one kernel serves both the 040 and 060 editions.
      - name: Build the kernel, the 060 package and the network driver
        working-directory: freemint
        env:
          M68K_ATARI_MINT_CROSS: yes
          KDEFS: >-
            -DCRYPTO_CODE -DSOFT_UNITABLE -DBUILTIN_SHELL -DM68040 -DOLDTOSFS -DWITH_MMU_SUPPORT -DMACHINE_QEMU_VIRT
        run: |
          set -eux
          make -C sys \
            kerneltargets=hat02060 \
            CPU_hat02060=02060 \
            MINT_hat02060=mint0206h.prg \
            "KERNELDEFS_hat02060=$KDEFS" \
            hat02060
          make -C sys/arch/060sp
          make -C sys/sockets/xif/virtio_net

      # The kernel records its own build flags, so this checks that what
      # came out is the kernel we asked for rather than merely that a
      # kernel came out. Without it a target that silently fell back to
      # different defs would ship looking identical.
      - name: Check the kernel is the one we asked for
        run: |
          set -eu
          for f in freemint/sys/.compile_hat02060/mint0206h.prg \
                   freemint/sys/arch/060sp/060sp.prg \
                   freemint/sys/sockets/xif/virtio_net/.compile_02060/virtio_net.xif; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          strings freemint/sys/.compile_hat02060/mint0206h.prg \
            | grep -q -- "-DMACHINE_QEMU_VIRT" \
            || { echo "kernel was not built with MACHINE_QEMU_VIRT" >&2; exit 1; }
          strings freemint/sys/.compile_hat02060/mint0206h.prg \
            | grep -q -- "-m68020-60" \
            || { echo "kernel is not an 020-060 build" >&2; exit 1; }
          mkdir -p mint
          cp freemint/sys/.compile_hat02060/mint0206h.prg mint/
          cp freemint/sys/arch/060sp/060sp.prg mint/
          cp freemint/sys/sockets/xif/virtio_net/.compile_02060/virtio_net.xif mint/
          ls -l mint/

      - uses: actions/upload-artifact@v5
        with:
          name: mint
          path: mint/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows package
    needs: [ guest, test, freemint ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: guest
          path: guest
      - uses: actions/download-artifact@v5
        with:
          name: mint
          path: mint

      - name: Install the cross toolchain and installer builder
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nsis p7zip-full

      - name: Fetch SDL2 for mingw
        run: |
          set -eux
          curl -fsSL "$SDL2_MINGW_URL" -o sdl2.tar.gz
          mkdir -p "${{ github.workspace }}/mingw-sdl2"
          tar xzf sdl2.tar.gz --strip-components=1 \
              -C "${{ github.workspace }}/mingw-sdl2"

      - name: Fetch and unpack QEMU for Windows
        run: |
          set -eux
          curl -fsSL "$QEMU_WIN_URL" -o qemu-w64-setup.exe
          mkdir -p qemu-w64
          7z x -oqemu-w64 qemu-w64-setup.exe > /dev/null
          test -s qemu-w64/qemu-system-m68k.exe

      - name: Build the package
        env:
          SHINOGI_ELF: ${{ github.workspace }}/guest/emutos-virt.elf
          QEMU_WIN: ${{ github.workspace }}/qemu-w64
          SDL2_MINGW: ${{ github.workspace }}/mingw-sdl2/x86_64-w64-mingw32
          # Without these three the packager looks for a FreeMiNT tree in
          # a home directory, which is why this job failed on every run
          # before the freemint job existed.
          SHINOGI_MINT_KERNEL: ${{ github.workspace }}/mint/mint0206h.prg
          SHINOGI_060SP: ${{ github.workspace }}/mint/060sp.prg
          SHINOGI_NET_DRIVER: ${{ github.workspace }}/mint/virtio_net.xif
        run: ./tools/make-windows-package.sh "${{ github.workspace }}/dist"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macos package
    needs: [ guest, test ]
    runs-on: macos-14          # Apple Silicon
    # The secrets context is not available in an `if:` condition, but it
    # is available in `env:`. Resolve the "do we have credentials" checks
    # once here, and let the steps test these instead.
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAVE_NOTARY: ${{ secrets.MACOS_NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: guest
          path: guest

      - name: Install QEMU and the bundling tool
        # dylibbundler rewrites QEMU's dylib references to
        # @executable_path so the app runs on a machine without
        # Homebrew. It is not preinstalled on the runner.
        run: brew install qemu dylibbundler

      - name: Build the app bundle
        env:
          SHINOGI_ELF: ${{ github.workspace }}/guest/emutos-virt.elf
        run: ./tools/make-macos-package.sh "${{ github.workspace }}/dist"

      # Signing and notarisation only run when the secrets exist, so a
      # fork or a pull request still produces an unsigned bundle that can
      # be tested locally with `xattr -d com.apple.quarantine`.
      - name: Import the signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign
        if: env.HAVE_CERT == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./tools/sign-macos.sh "${{ github.workspace }}/dist/shinogi.app"

      - name: Notarise
        if: env.HAVE_NOTARY == 'true'
        env:
          ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          set -eu
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent dist/shinogi.app "$RUNNER_TEMP/shinogi.zip"
          xcrun notarytool submit "$RUNNER_TEMP/shinogi.zip" \
            --issuer "$ISSUER" --key-id "$KEY_ID" \
            --key "$RUNNER_TEMP/notary.p8" --wait
          # The ticket has to be stapled to the bundle, or a machine that
          # is offline when it first runs the app still sees it as
          # unnotarised.
          xcrun stapler staple dist/shinogi.app
          xcrun stapler validate dist/shinogi.app
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Package for download
        run: |
          set -eu
          VERSION=$(cat VERSION)
          ditto -c -k --keepParent dist/shinogi.app \
            "dist/shinogi-$VERSION-macos-arm64.zip"
          shasum -a 256 "dist/shinogi-$VERSION-macos-arm64.zip" \
            > "dist/shinogi-$VERSION-macos-arm64.zip.sha256"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 7
